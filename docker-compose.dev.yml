# Yuvomi HNMZ — instance de développement (hot reload)
# Données isolées de la prod Unraid (conteneur yuvomi / port 3007 / appdata/yuvomi).
# Réseau bw-apps : même réseau que BunkerWeb, pour bascule du reverse proxy.
#
# Usage (sur Unraid) :
#   bash scripts/unraid-dev-up.sh
#   bash scripts/unraid-sync-prod-to-dev.sh   # copie les bind mounts prod → dev
#   bash scripts/unraid-failover-to-dev.sh    # pointe dashboard.* vers ce conteneur
#
# Accès LAN : http://192.168.50.2:3008
# Accès public (après bascule) : https://dashboard.huvelin-maniez.fr

services:
  yuvomi-hnmz-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: yuvomi-hnmz-dev:local
    container_name: yuvomi-hnmz-dev
    restart: unless-stopped
    ports:
      # Port hôte ≠ 3007 (prod Yuvomi officielle)
      - "0.0.0.0:${OIKOS_HTTP_PORT:-3008}:3000"
    volumes:
      # Code source monté → hot reload (node --watch via npm run dev)
      - .:/app
      # node_modules du conteneur (évite d'écraser avec le mount hôte)
      - yuvomi_hnmz_dev_node_modules:/app/node_modules
      # Binds miroir de la prod, dans un appdata séparé
      - ${YUVOMI_DEV_DATA:-/mnt/user/appdata/yuvomi-hnmz-dev/data}:/data
      - ${YUVOMI_DEV_BACKUPS:-/mnt/user/appdata/yuvomi-hnmz-dev/backups}:/backups
      - ${YUVOMI_DEV_MODULES:-/mnt/user/appdata/yuvomi-hnmz-dev/modules}:/app/modules
      - ${YUVOMI_DEV_DOCUMENTS:-/mnt/user/appdata/yuvomi-hnmz-dev/documents}:/documents
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_PATH=${DB_PATH:-/data/yuvomi.db}
      - BACKUP_DIR=/backups
      - DOCUMENT_STORAGE_LOCAL_ENABLED=${DOCUMENT_STORAGE_LOCAL_ENABLED:-false}
      - DOCUMENT_STORAGE_LOCAL_PATH=${DOCUMENT_STORAGE_LOCAL_PATH:-/documents}
      - SESSION_SECURE=${SESSION_SECURE:-false}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - BASE_URL=${BASE_URL:-https://dashboard.huvelin-maniez.fr}
      - TZ=${TZ:-Europe/Paris}
    networks:
      - default
      - bw-apps
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  yuvomi_hnmz_dev_node_modules:

networks:
  bw-apps:
    external: true
